[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "antigravity-schemas"
version = "0.1.0"
description = "Automated Schema Extraction & Validation Toolkit for the complete Google Antigravity Ecosystem (Desktop 2.0, IDE, CLI, SDK, and Shared Core)"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Antigravity Research Team"}
]
dependencies = [
    "pydantic>=2.0.0",
    "jsonschema>=4.18.0",
    "pyyaml>=6.0.0",
    "rich>=13.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
]

[project.scripts]
agy-schema = "antigravity_schemas.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
